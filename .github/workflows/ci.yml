name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

env:
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3008
  NEXT_PUBLIC_SUPABASE_URL: https://storycam.example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: local-anon-key
  SUPABASE_SERVICE_ROLE_KEY: local-service-role-key
  STORYCAM_GENERATION_MODE: mock
  STORYCAM_TEXT_PROVIDER: mock
  STORYCAM_MULTIMODAL_PROVIDER: mock
  STORYCAM_IMAGE_PROVIDER: mock
  STORYCAM_VIDEO_PROVIDER: mock
  STORYCAM_FINAL_WORK_PROVIDER: mock

jobs:
  pr-fast:
    name: PR Fast Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run PR fast gate
        run: scripts/check-pr.sh

  dev-integration:
    name: Dev Integration Gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run dev integration gate
        run: scripts/check-dev.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-playwright-test-results
          path: test-results/
          if-no-files-found: ignore

  main-release:
    name: Main Release Gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run main release gate
        run: scripts/check-release.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: main-playwright-report
          path: playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: main-playwright-test-results
          path: test-results/
          if-no-files-found: ignore
