name: Production Uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-uptime
  cancel-in-progress: true

jobs:
  live-check:
    name: Live Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STORYCAM_LIVE_BASE_URL: https://storycam.znbuild.com
      STORYCAM_DEEP_HEALTH_TOKEN: ${{ secrets.STORYCAM_PRODUCTION_DEEP_HEALTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify live production health
        run: node scripts/storycam-verify-live.mjs
