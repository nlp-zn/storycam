<!DOCTYPE html>

<html class="dark" lang="zh"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>StoryCam - 输入创意</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@400;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#849495",
                        "secondary": "#ffb1c3",
                        "surface-bright": "#393939",
                        "primary": "#dbfcff",
                        "on-primary-container": "#006970",
                        "primary-container": "#00f0ff",
                        "surface-variant": "#353535",
                        "secondary-container": "#ff4b89",
                        "inverse-on-surface": "#303030",
                        "background": "#131313",
                        "primary-fixed-dim": "#00dbe9",
                        "on-primary-fixed-variant": "#004f54",
                        "inverse-surface": "#e2e2e2",
                        "on-tertiary-fixed": "#370e00",
                        "on-error-container": "#ffdad6",
                        "error": "#ffb4ab",
                        "on-primary": "#00363a",
                        "inverse-primary": "#006970",
                        "on-surface": "#e2e2e2",
                        "secondary-fixed": "#ffd9e0",
                        "outline-variant": "#3b494b",
                        "on-tertiary": "#5a1b00",
                        "tertiary-container": "#ffcfbe",
                        "on-background": "#e2e2e2",
                        "on-secondary-container": "#590026",
                        "on-error": "#690005",
                        "surface-container-low": "#1b1b1b",
                        "surface-container-highest": "#353535",
                        "tertiary": "#fff3f0",
                        "on-secondary": "#66002c",
                        "surface-container-high": "#2a2a2a",
                        "surface-container": "#1f1f1f",
                        "secondary-fixed-dim": "#ffb1c3",
                        "on-secondary-fixed": "#3f0019",
                        "surface": "#131313",
                        "on-tertiary-container": "#a83a00",
                        "tertiary-fixed": "#ffdbce",
                        "on-secondary-fixed-variant": "#8f0041",
                        "tertiary-fixed-dim": "#ffb59a",
                        "on-primary-fixed": "#002022",
                        "surface-container-lowest": "#0e0e0e",
                        "error-container": "#93000a",
                        "surface-tint": "#00dbe9",
                        "surface-dim": "#131313",
                        "primary-fixed": "#7df4ff",
                        "on-surface-variant": "#b9cacb",
                        "on-tertiary-fixed-variant": "#802a00"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "pill-padding-x": "32px",
                        "pill-padding-y": "16px",
                        "base": "8px",
                        "container-max": "1440px",
                        "gutter": "24px",
                        "margin": "40px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Manrope"],
                        "headline-md": ["Manrope"],
                        "body-md": ["Inter"],
                        "display-xl": ["Manrope"],
                        "body-lg": ["Inter"],
                        "label-caps": ["Manrope"]
                    },
                    "fontSize": {
                        "headline-lg": ["48px", { "lineHeight": "110%", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-md": ["32px", { "lineHeight": "120%", "letterSpacing": "0em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "160%", "letterSpacing": "0em", "fontWeight": "400" }],
                        "display-xl": ["80px", { "lineHeight": "100%", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "body-lg": ["18px", { "lineHeight": "160%", "letterSpacing": "0em", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "100%", "letterSpacing": "0.1em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        /* Custom scrollbar for deep void aesthetic */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #131313; }
        ::-webkit-scrollbar-thumb { background: #353535; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00dbe9; }
        
        /* Neon glow utilities */
        .neon-glow-cyan { filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.4)); }
        .neon-glow-pink { filter: drop-shadow(0 0 20px rgba(255, 75, 137, 0.5)); }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container relative overflow-x-hidden">
<!-- Top App Bar -->
<header class="fixed top-0 inset-x-0 h-20 bg-black/40 backdrop-blur-xl z-50 flex items-center justify-between px-8 border-b border-white/5">
<div class="font-headline-md italic font-bold text-primary-container text-2xl neon-glow-cyan tracking-wider">
        StoryCam 导演工作台
    </div>
<div class="flex items-center gap-6">
<button class="text-on-surface-variant hover:text-primary-container transition-colors duration-300">
<span class="material-symbols-outlined text-[28px]">notifications</span>
</button>
<button class="w-10 h-10 rounded-full bg-surface-container-high border border-outline-variant flex items-center justify-center text-primary-container hover:border-primary-container hover:shadow-[0_0_15px_rgba(0,240,255,0.3)] transition-all duration-300 overflow-hidden">
<span class="material-symbols-outlined">person</span>
</button>
</div>
</header>
<!-- Ambient Background Glows -->
<div class="fixed top-[-20%] left-[-10%] w-[50vw] h-[50vw] rounded-full bg-primary-container/5 blur-[150px] pointer-events-none z-0"></div>
<div class="fixed bottom-[-20%] right-[-10%] w-[60vw] h-[60vw] rounded-full bg-secondary-container/5 blur-[150px] pointer-events-none z-0"></div>
<!-- Main Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-gutter pt-32 pb-margin relative z-10 w-full max-w-container-max mx-auto">
<!-- Progress Indicator -->
<div class="w-full max-w-4xl mx-auto mt-8 mb-16 relative">
<div class="flex items-center justify-between relative">
<!-- Connecting line -->
<div class="absolute left-0 right-0 top-1/2 -translate-y-1/2 h-[2px] bg-[#353535] z-0"></div>
<!-- Steps -->
<div class="relative z-10 flex flex-col items-center">
<div class="w-12 h-12 rounded-full border-[3px] border-primary-container bg-background flex items-center justify-center font-bold text-2xl text-primary-container shadow-[0_0_20px_rgba(0,240,255,0.6)]">1</div>
<div class="absolute top-16 text-primary-container text-sm font-bold whitespace-nowrap tracking-wider">输入创意</div>
</div>
<div class="relative z-10 flex flex-col items-center">
<div class="w-10 h-10 rounded-full border border-[#353535] bg-[#1a1a1a] flex items-center justify-center font-bold text-lg text-outline">2</div>
<div class="absolute top-14 text-outline text-sm font-bold whitespace-nowrap tracking-wider">故事世界</div>
</div>
<div class="relative z-10 flex flex-col items-center">
<div class="w-10 h-10 rounded-full border border-[#353535] bg-[#1a1a1a] flex items-center justify-center font-bold text-lg text-outline">3</div>
<div class="absolute top-14 text-outline text-sm font-bold whitespace-nowrap tracking-wider">分镜生成</div>
</div>
<div class="relative z-10 flex flex-col items-center">
<div class="w-10 h-10 rounded-full border border-[#353535] bg-[#1a1a1a] flex items-center justify-center font-bold text-lg text-outline">4</div>
</div>
<div class="relative z-10 flex flex-col items-center">
<div class="w-10 h-10 rounded-full border border-[#353535] bg-[#1a1a1a] flex items-center justify-center font-bold text-lg text-outline">5</div>
</div>
<div class="relative z-10 flex flex-col items-center">
<div class="w-10 h-10 rounded-full border border-[#353535] bg-[#1a1a1a] flex items-center justify-center font-bold text-lg text-outline">6</div>
</div>
<div class="relative z-10 flex flex-col items-center">
<div class="w-10 h-10 rounded-full border border-[#353535] bg-[#1a1a1a] flex items-center justify-center font-bold text-lg text-outline">7</div>
<div class="absolute top-14 text-outline text-sm font-bold whitespace-nowrap tracking-wider">导出</div>
</div>
</div>
</div>
<!-- Center Stage Container -->
<div class="w-full max-w-4xl flex flex-col gap-12 mt-4">
<!-- Context Label -->
<div class="flex items-center gap-4 animate-fade-in-up">
<div class="h-px w-12 bg-primary-container/50"></div>
<span class="font-label-caps text-label-caps text-primary-fixed uppercase tracking-[0.2em]">第一步：核心前提</span>
</div>
<!-- Input Area (Level 1/2 Glassmorphism) -->
<div class="relative group">
<!-- Glowing border effect container -->
<div class="absolute -inset-0.5 bg-gradient-to-r from-primary-container/30 to-transparent rounded-xl blur opacity-30 group-focus-within:opacity-100 group-focus-within:from-primary-container group-focus-within:to-secondary-container transition duration-500"></div>
<div class="relative bg-surface-container-low/80 backdrop-blur-2xl border border-outline-variant/50 rounded-xl p-10 flex flex-col gap-4 shadow-2xl transition-all duration-300 group-focus-within:border-primary-container/50 group-focus-within:bg-surface-container/90">
<textarea class="w-full bg-transparent border-none text-on-surface font-headline-lg text-headline-lg focus:ring-0 resize-none overflow-hidden placeholder:text-on-surface-variant/30 py-0" placeholder="描述电影般的瞬间..." rows="3" spellcheck="false">我想把一段暗恋变成韩剧里的雨夜</textarea>
<!-- Character count indicator (subtle) -->
<div class="flex justify-end pt-4 border-t border-white/5 mt-4">
<span class="font-label-caps text-label-caps text-on-surface-variant/50">16 / 120</span>
</div>
</div>
</div>
<!-- Light Director Tags Section -->
<div class="flex flex-col gap-6 pl-2">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-secondary-container" style="font-variation-settings: 'FILL' 1;">tune</span>
<h3 class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-[0.15em]">灯光指导</h3>
</div>
<div class="flex flex-wrap gap-4">
<!-- Chip 1: Selected state (Neon fill) -->
<button class="px-pill-padding-x py-pill-padding-y rounded-full bg-primary-container text-on-primary-container font-label-caps text-label-caps uppercase tracking-widest shadow-[0_0_15px_rgba(0,240,255,0.3)] hover:brightness-110 hover:shadow-[0_0_25px_rgba(0,240,255,0.5)] transition-all duration-300 active:scale-95 border border-primary-container flex items-center gap-2">
<span>更多遗憾</span>
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
<!-- Chip 2: Unselected state (Glass outline) -->
<button class="px-pill-padding-x py-pill-padding-y rounded-full bg-surface-container-high/50 backdrop-blur-md border border-outline-variant text-on-surface font-label-caps text-label-caps uppercase tracking-widest hover:border-primary-container/50 hover:bg-surface-container-highest transition-all duration-300 active:scale-95">
                        私人记忆
                    </button>
<!-- Chip 3: Unselected state (Glass outline) -->
<button class="px-pill-padding-x py-pill-padding-y rounded-full bg-surface-container-high/50 backdrop-blur-md border border-outline-variant text-on-surface font-label-caps text-label-caps uppercase tracking-widest hover:border-primary-container/50 hover:bg-surface-container-highest transition-all duration-300 active:scale-95">
                        少说话
                    </button>
<!-- Add New Tag Button -->
<button class="px-6 py-pill-padding-y rounded-full border border-dashed border-outline-variant text-on-surface-variant hover:text-white hover:border-white/50 transition-all duration-300 flex items-center justify-center">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
<!-- Bold Generate Action -->
<div class="mt-margin pt-12 flex justify-center">
<button class="group relative px-16 py-6 rounded-full bg-gradient-to-r from-secondary-container via-[#ff7a59] to-tertiary-container text-background font-headline-md text-headline-md uppercase tracking-wider overflow-hidden active:scale-[0.98] transition-transform duration-300 neon-glow-pink">
<!-- Energy sweep animation layer (simulated with CSS for potential keyframes, but static for now as requested no animations, just structural setup) -->
<div class="absolute inset-0 bg-white/20 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-700 ease-in-out"></div>
<span class="relative z-10 flex items-center gap-4">
                        生成创意
                        <span class="material-symbols-outlined text-[36px]" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</span>
</button>
</div>
</div>
</main>
</body></html>
