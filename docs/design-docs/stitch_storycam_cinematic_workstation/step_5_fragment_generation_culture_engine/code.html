<!DOCTYPE html>

<title>StoryCam - 片段生成</title>

                }
            }

<style>
        body { background-color: theme('colors.background'); color: theme('colors.on-background'); }
        .glass-panel {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .neon-glow {
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
        }
        .neon-text-glow {
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }
        .gradient-border-top {
            position: relative;
        }
        .gradient-border-top::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, theme('colors.primary-container'), transparent);
        }
        .progress-line {
            background: linear-gradient(to right, theme('colors.primary-container') 66%, theme('colors.surface-container-highest') 66%);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col pt-20 pb-24 md:pb-0 bg-background text-on-background">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-10 h-20 bg-black/60 backdrop-blur-md border-b border-surface-container-highest">
<div class="text-2xl font-black italic tracking-tighter text-primary-container neon-text-glow flex items-center gap-2">
<span>StoryCam</span> <span class="text-lg italic font-bold text-primary-container">导演工作台</span>
</div>
<div class="flex items-center gap-6">
<button class="text-outline hover:text-white transition-colors duration-300">
<span class="material-symbols-outlined text-2xl">notifications</span>
</button>
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-outline hover:border-white transition-colors duration-300">
<img alt="User Profile" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBIpa0k-FvC-FguYUuzq67qVlEaatexBwSbr6EggIz8-eW5sUt9VlFaUbM04hc2hx_O3McRAyUzXmlPz8Sn0QN7KSKItqsOcBHCpDaXBX3cVVwP7-zqCxHvY7n1J6CIUxet0diT5qpZ0fllClbnUfsMtXJh2_glLkKkZJ47W4RoI0_7UFaqpeGpXiyowqTLqwBOs6f1jmhnnc7IidMip5cL0-1JQSdp5AT7pZOKV8GTZfh69irJoI5OhOyBtNxsyKoqBZ7prasMiEE"/>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col p-6 md:p-margin max-w-container-max mx-auto w-full gap-8">
<!-- Progress Indicator Area -->
<section class="w-full py-6 px-10 relative hidden md:block">
<div class="absolute top-1/2 left-10 right-10 h-0.5 -translate-y-1/2 z-0 progress-line"></div>
<div class="flex justify-between items-center relative z-10">
<!-- Step 1 -->
<div class="flex flex-col items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container-lowest border-2 border-primary-container text-primary-container flex items-center justify-center font-bold text-sm shadow-[0_0_15px_rgba(0,240,255,0.3)]">1</div>
<span class="text-sm font-bold text-primary-container">剧本导入</span>
</div>
<!-- Step 2 -->
<div class="flex flex-col items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container-lowest border-2 border-primary-container text-primary-container flex items-center justify-center font-bold text-sm shadow-[0_0_15px_rgba(0,240,255,0.3)]">2</div>
<span class="text-sm font-bold text-primary-container">故事世界</span>
</div>
<!-- Step 3 -->
<div class="flex flex-col items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container-lowest border-2 border-primary-container text-primary-container flex items-center justify-center font-bold text-sm shadow-[0_0_15px_rgba(0,240,255,0.3)]">3</div>
<span class="text-sm font-bold text-primary-container">分镜生成</span>
</div>
<!-- Step 4 -->
<div class="flex flex-col items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container-lowest border-2 border-primary-container text-primary-container flex items-center justify-center font-bold text-sm shadow-[0_0_15px_rgba(0,240,255,0.3)]">4</div>
<span class="text-sm font-bold text-primary-container">扩展</span>
</div>
<!-- Step 5 (Active) -->
<div class="flex flex-col items-center gap-3">
<div class="w-12 h-12 rounded-full bg-surface-container-lowest border-2 border-primary-container text-primary-container flex items-center justify-center font-bold text-lg shadow-[0_0_20px_rgba(0,240,255,0.6)] neon-glow">5</div>
<span class="text-sm font-bold text-primary-container neon-text-glow">片段生成</span>
</div>
<!-- Step 6 -->
<div class="flex flex-col items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container-highest border border-outline text-outline flex items-center justify-center font-bold text-sm">6</div>
<span class="text-sm font-bold text-outline">审核</span>
</div>
<!-- Step 7 -->
<div class="flex flex-col items-center gap-3">
<div class="w-10 h-10 rounded-full bg-surface-container-highest border border-outline text-outline flex items-center justify-center font-bold text-sm">7</div>
<span class="text-sm font-bold text-outline">导出</span>
</div>
</div>
</section>
<div class="flex flex-col md:flex-row gap-6 w-full">
<!-- Large Video Preview Area -->
<section class="flex-grow flex flex-col gap-4 relative">
<div class="flex items-center justify-between mb-2">
<h1 class="font-headline-md text-headline-md text-on-background">片段生成</h1>
<div class="flex items-center gap-2 bg-surface-container-high px-4 py-2 rounded-full border border-primary-container/30">
<span class="material-symbols-outlined text-primary-container animate-pulse" style="font-variation-settings: 'FILL' 1;">memory</span>
<span class="font-label-caps text-label-caps text-primary-container uppercase tracking-widest">渲染中</span>
</div>
</div>
<!-- Video Player Container (Glassmorphism + Tonal Layer) -->
<div class="relative w-full aspect-video rounded-xl overflow-hidden glass-panel neon-glow flex items-center justify-center bg-surface-container-lowest border border-surface-container-highest">
<!-- Placeholder Image -->
<img class="absolute inset-0 w-full h-full object-cover opacity-60" data-alt="Cinematic, high-energy abstract digital landscape with neon cyan grids and deep black void, showing a futuristic city forming" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBmDe3FVfjHajsPt7K3mJhs1mdW5_1ONn5Ah3cD_X6y64DnXS1HCEngYahZ_gqRh49wDf6OEv8afdgWdwj3zhcR-NRNQYtnLWbDBJYVmxCY30U2pM9sZ7pd310NpFBtO02Poa2Yhvq0Vev_tP5UlCiCiueFX5MxixjYtGiiIH44PDXYlSF0bKCvHypQFWCI694RLnxPsl4FecnBfjCPL8KZAZhYyob3mWzEsjAdQgALWkpsfQitY5cb3rHDYhTG6FeYfgjslcYzX8g"/>
<!-- Progress Overlay -->
<div class="absolute inset-0 flex flex-col items-center justify-center bg-black/40 backdrop-blur-sm z-10">
<div class="relative w-48 h-48 flex items-center justify-center">
<svg class="absolute inset-0 w-full h-full -rotate-90" viewbox="0 0 100 100">
<circle cx="50" cy="50" fill="none" r="45" stroke="rgba(255,255,255,0.1)" stroke-width="2"></circle>
<circle class="text-primary-container drop-shadow-[0_0_10px_rgba(0,240,255,0.8)]" cx="50" cy="50" fill="none" r="45" stroke="currentColor" stroke-dasharray="283" stroke-dashoffset="99" stroke-width="4"></circle>
</svg>
<div class="text-center">
<span class="font-display-xl text-display-xl text-primary-container neon-text-glow">65<span class="text-4xl">%</span></span>
</div>
</div>
<div class="mt-8 font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">正在处理神经权重</div>
</div>
<!-- Fake Player Controls (Level 2 Surface) -->
<div class="absolute bottom-6 left-6 right-6 flex items-center gap-4 bg-surface-container p-4 rounded-xl border border-primary-container/20 z-20">
<button class="text-on-background hover:text-primary-container transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
<!-- Linear Progress Bar -->
<div class="flex-grow h-1 bg-surface-bright rounded-full overflow-hidden relative">
<div class="absolute top-0 left-0 h-full w-[65%] bg-gradient-to-r from-primary-fixed-dim to-primary-container shadow-[0_0_10px_rgba(0,240,255,0.5)]"></div>
</div>
<span class="font-code text-xs text-on-surface-variant">00:14 / 00:22</span>
<button class="text-on-background hover:text-primary-container transition-colors">
<span class="material-symbols-outlined">fullscreen</span>
</button>
</div>
</div>
<!-- Secondary Actions -->
<div class="flex gap-4 mt-2">
<button class="flex items-center gap-2 px-pill-padding-x py-pill-padding-y rounded-full border border-primary-container text-primary-container hover:bg-primary-container/10 transition-colors font-label-caps text-label-caps uppercase">
<span class="material-symbols-outlined">pause</span> 暂停渲染
                </button>
<button class="flex items-center gap-2 px-pill-padding-x py-pill-padding-y rounded-full border border-outline-variant text-on-surface-variant hover:text-on-background hover:bg-surface-container-high transition-colors font-label-caps text-label-caps uppercase">
<span class="material-symbols-outlined">close</span> 取消
                </button>
</div>
</section>
<!-- Side Panel: Director's Notes -->
<aside class="w-full md:w-80 flex flex-col gap-4">
<div class="bg-surface-container-lowest border border-surface-container-highest rounded-xl p-6 flex-grow flex flex-col gradient-border-top h-[600px] md:h-auto">
<div class="flex items-center gap-3 mb-6 border-b border-surface-container-highest pb-4">
<span class="material-symbols-outlined text-secondary-container">terminal</span>
<h2 class="font-headline-md text-xl text-on-background m-0">导演笔记</h2>
</div>
<div class="flex-grow overflow-y-auto space-y-4 pr-2 custom-scrollbar font-code text-sm text-on-surface-variant">
<div class="bg-surface-container p-3 rounded-lg border border-surface-container-highest">
<span class="text-outline text-xs block mb-1">系统日志.01</span>
<span class="text-primary-container">&gt;</span> 向Alpha区域注入高对比度霓虹色板。
                    </div>
<div class="bg-surface-container p-3 rounded-lg border border-surface-container-highest">
<span class="text-outline text-xs block mb-1">导演指令</span>
<span class="text-secondary-container">&gt;</span> 增加全景镜头的景深。将背景实体模糊40%。
                    </div>
<div class="bg-surface-container p-3 rounded-lg border border-surface-container-highest opacity-70">
<span class="text-outline text-xs block mb-1">系统参数</span>
<span class="text-on-surface-variant">&gt;</span> 运动模糊计算中... [等待]
                    </div>
<div class="bg-surface-container p-3 rounded-lg border border-surface-container-highest opacity-70">
<span class="text-outline text-xs block mb-1">系统参数</span>
<span class="text-on-surface-variant">&gt;</span> 渲染体积雾... [65%]
                    </div>
</div>
<div class="mt-4 pt-4 border-t border-surface-container-highest">
<div class="flex items-center justify-between font-label-caps text-label-caps text-on-background mb-2">
<span>内存使用</span>
<span class="text-secondary-container">84%</span>
</div>
<!-- Mini Progress Bar -->
<div class="w-full h-1 bg-surface-bright rounded-full overflow-hidden">
<div class="h-full w-[84%] bg-gradient-to-r from-secondary-container to-[#ffb1c3]"></div>
</div>
</div>
</div>
</aside>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden fixed bottom-0 w-full z-50 flex justify-center items-center py-6 px-10 bg-surface-container-lowest/90 backdrop-blur-2xl rounded-t-3xl border-t border-primary-container/20 shadow-[0_-10px_40px_rgba(0,0,0,0.8)]">
<button class="flex items-center gap-2 bg-gradient-to-r from-primary-container to-blue-600 text-black rounded-full px-8 py-3 shadow-[0_0_15px_rgba(0,240,255,0.4)] hover:brightness-110 hover:shadow-[0_0_25px_rgba(0,240,255,0.6)] active:scale-98 transition-transform">
<span class="font-manrope font-extrabold uppercase tracking-widest text-sm">确认并继续</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</nav>
