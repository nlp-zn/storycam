<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>分镜扩展画布</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&amp;family=Inter:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "outline": "#849495",
                        "secondary": "#ffb1c3",
                        "surface-bright": "#393939",
                        "primary": "#dbfcff",
                        "on-primary-container": "#006970",
                        "primary-container": "#00f0ff",
                        "surface-variant": "#353535",
                        "secondary-container": "#ff4b89",
                        "inverse-on-surface": "#303030",
                        "background": "#131313",
                        "primary-fixed-dim": "#00dbe9",
                        "on-primary-fixed-variant": "#004f54",
                        "inverse-surface": "#e2e2e2",
                        "on-tertiary-fixed": "#370e00",
                        "on-error-container": "#ffdad6",
                        "error": "#ffb4ab",
                        "on-primary": "#00363a",
                        "inverse-primary": "#006970",
                        "on-surface": "#e2e2e2",
                        "secondary-fixed": "#ffd9e0",
                        "outline-variant": "#3b494b",
                        "on-tertiary": "#5a1b00",
                        "tertiary-container": "#ffcfbe",
                        "on-background": "#e2e2e2",
                        "on-secondary-container": "#590026",
                        "on-error": "#690005",
                        "surface-container-low": "#1b1b1b",
                        "surface-container-highest": "#353535",
                        "tertiary": "#fff3f0",
                        "on-secondary": "#66002c",
                        "surface-container-high": "#2a2a2a",
                        "surface-container": "#1f1f1f",
                        "secondary-fixed-dim": "#ffb1c3",
                        "on-secondary-fixed": "#3f0019",
                        "surface": "#131313",
                        "on-tertiary-container": "#a83a00",
                        "tertiary-fixed": "#ffdbce",
                        "on-secondary-fixed-variant": "#8f0041",
                        "tertiary-fixed-dim": "#ffb59a",
                        "on-primary-fixed": "#002022",
                        "surface-container-lowest": "#0e0e0e",
                        "error-container": "#93000a",
                        "surface-tint": "#00dbe9",
                        "surface-dim": "#131313",
                        "primary-fixed": "#7df4ff",
                        "on-surface-variant": "#b9cacb",
                        "on-tertiary-fixed-variant": "#802a00"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "pill-padding-x": "32px",
                        "pill-padding-y": "16px",
                        "base": "8px",
                        "container-max": "1440px",
                        "gutter": "24px",
                        "margin": "40px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Manrope", "sans-serif"],
                        "headline-md": ["Manrope", "sans-serif"],
                        "body-md": ["Inter", "sans-serif"],
                        "display-xl": ["Manrope", "sans-serif"],
                        "body-lg": ["Inter", "sans-serif"],
                        "label-caps": ["Manrope", "sans-serif"]
                    },
                    "fontSize": {
                        "headline-lg": ["48px", { "lineHeight": "110%", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-md": ["32px", { "lineHeight": "120%", "letterSpacing": "0em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "160%", "letterSpacing": "0em", "fontWeight": "400" }],
                        "display-xl": ["80px", { "lineHeight": "100%", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "body-lg": ["18px", { "lineHeight": "160%", "letterSpacing": "0em", "fontWeight": "400" }],
                        "label-caps": ["12px", { "lineHeight": "100%", "letterSpacing": "0.1em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        .glass-panel {
            background: rgba(31, 31, 31, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .neon-border {
            border: 1px solid rgba(0, 240, 255, 0.3);
            box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.05), 0 0 15px rgba(0, 240, 255, 0.1);
        }
        .wait-state-pattern {
            background-image: repeating-linear-gradient(
                45deg,
                rgba(255, 255, 255, 0.03) 0px,
                rgba(255, 255, 255, 0.03) 2px,
                transparent 2px,
                transparent 8px
            );
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<nav class="fixed top-0 w-full z-50 flex items-center justify-between px-10 h-20 bg-black/80 backdrop-blur-xl border-b border-white/5">
<!-- Brand -->
<div class="text-2xl font-black italic tracking-tighter text-primary-container drop-shadow-[0_0_10px_rgba(0,240,255,0.8)]">StoryCam 导演工作台</div>
<!-- Trailing Action -->
<div class="flex items-center gap-6">
<button aria-label="Notifications" class="text-outline hover:text-white transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-[24px]">notifications</span>
</button>
<button aria-label="Profile" class="text-outline hover:text-white transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-[28px]">account_circle</span>
</button>
</div>
</nav>
<!-- Main Canvas Area -->
<main class="pt-[100px] pb-[160px] px-margin max-w-container-max mx-auto w-full min-h-screen relative">
<!-- Subtle Background Glow -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-primary-container rounded-full opacity-[0.03] blur-[100px] pointer-events-none"></div>
<!-- Progress Stepper -->
<div class="w-full max-w-5xl mx-auto mb-16 mt-8 relative">
<!-- Background Line -->
<div class="absolute top-6 left-0 w-full h-[1px] bg-surface-variant z-0"></div>
<!-- Active Line (up to step 4) -->
<div class="absolute top-6 left-0 w-[50%] h-[2px] bg-primary-container shadow-[0_0_10px_rgba(0,240,255,0.6)] z-0"></div>
<div class="flex justify-between relative z-10">
<!-- Step 1 -->
<div class="flex flex-col items-center gap-3 w-16">
<div class="w-12 h-12 rounded-full bg-surface-container-low border border-outline-variant flex items-center justify-center text-outline font-body-md">1</div>
<span class="text-[13px] text-outline whitespace-nowrap">剧本导入</span>
</div>
<!-- Step 2 -->
<div class="flex flex-col items-center gap-3 w-16">
<div class="w-12 h-12 rounded-full bg-surface-container-low border border-outline-variant flex items-center justify-center text-outline font-body-md">2</div>
<span class="text-[13px] text-outline whitespace-nowrap">故事世界</span>
</div>
<!-- Step 3 -->
<div class="flex flex-col items-center gap-3 w-16">
<div class="w-12 h-12 rounded-full bg-surface-container-low border border-outline-variant flex items-center justify-center text-outline font-body-md">3</div>
<span class="text-[13px] text-outline whitespace-nowrap">分镜生成</span>
</div>
<!-- Step 4 (Active) -->
<div class="flex flex-col items-center gap-3 w-16">
<div class="w-12 h-12 rounded-full bg-surface-container-low border-2 border-primary-container flex items-center justify-center text-primary-container font-headline-md text-xl shadow-[0_0_20px_rgba(0,240,255,0.3)]">4</div>
<span class="text-[13px] text-primary-container whitespace-nowrap font-bold">分镜扩展</span>
</div>
<!-- Step 5 -->
<div class="flex flex-col items-center gap-3 w-16">
<div class="w-12 h-12 rounded-full bg-surface-container-low border border-outline-variant flex items-center justify-center text-outline font-body-md">5</div>
<span class="text-[13px] text-transparent whitespace-nowrap">.</span>
</div>
<!-- Step 6 -->
<div class="flex flex-col items-center gap-3 w-16">
<div class="w-12 h-12 rounded-full bg-surface-container-low border border-outline-variant flex items-center justify-center text-outline font-body-md">6</div>
<span class="text-[13px] text-transparent whitespace-nowrap">.</span>
</div>
<!-- Step 7 -->
<div class="flex flex-col items-center gap-3 w-16">
<div class="w-12 h-12 rounded-full bg-surface-container-low border border-outline-variant flex items-center justify-center text-outline font-body-md">7</div>
<span class="text-[13px] text-outline whitespace-nowrap">导出</span>
</div>
</div>
</div>
<!-- Header -->
<div class="text-center mb-16 relative z-10">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">分镜扩展画布</h1>
<p class="font-body-md text-body-md text-on-surface-variant">围绕核心分镜生成周边叙事向量。</p>
</div>
<!-- Workbench Grid Layout -->
<div class="grid grid-cols-1 lg:grid-cols-12 gap-gutter relative z-10 items-center">
<!-- Left Column: Reaction (Wait State) -->
<div class="lg:col-span-3 flex flex-col gap-6">
<div class="glass-panel border border-outline-variant rounded-xl p-6 relative overflow-hidden wait-state-pattern">
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-primary-container to-transparent opacity-50"></div>
<div class="flex items-center justify-between mb-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline text-[20px]">bolt</span>
<span class="font-label-caps text-label-caps text-on-surface-variant tracking-widest">反应</span>
</div>
<span class="material-symbols-outlined text-primary-container opacity-70 text-[20px]">hourglass_empty</span>
</div>
<div class="space-y-3 mt-8">
<div class="h-3 bg-surface-variant rounded-full w-full opacity-50"></div>
<div class="h-3 bg-surface-variant rounded-full w-5/6 opacity-50"></div>
<div class="h-3 bg-surface-variant rounded-full w-4/6 opacity-50"></div>
</div>
<div class="mt-6 pt-4 border-t border-surface-variant flex justify-between items-center text-on-surface-variant font-label-caps text-[10px]">
<span>状态</span>
<span class="text-primary-container">合成中...</span>
</div>
</div>
</div>
<!-- Center Column: Core Frame (Unsent Text) -->
<div class="lg:col-span-6 flex justify-center">
<div class="glass-panel rounded-[2rem] p-2 neon-border w-full max-w-[500px] relative shadow-[0_0_40px_rgba(0,240,255,0.15)]">
<!-- Frame Header -->
<div class="flex justify-between items-center px-6 py-4 border-b border-white/5">
<div class="flex items-center gap-3">
<div class="w-2 h-2 rounded-full bg-primary-container shadow-[0_0_8px_rgba(0,240,255,0.8)]"></div>
<span class="font-label-caps text-label-caps text-primary-container uppercase tracking-widest">核心分镜 01</span>
</div>
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">more_horiz</span>
</div>
<!-- Content Area (The "Unsent Text" visual) -->
<div class="bg-[#0a0a0a] rounded-[1.5rem] p-8 m-2 border border-white/5 relative overflow-hidden min-h-[300px] flex flex-col justify-end">
<div class="absolute inset-0 bg-gradient-to-t from-primary-container/5 to-transparent pointer-events-none"></div>
<!-- Simulated Message UI -->
<div class="w-full max-w-[80%] bg-surface-container-high rounded-2xl rounded-tr-sm p-4 border border-white/10 self-end mb-6 relative shadow-lg">
<p class="font-body-lg text-body-lg text-on-surface italic opacity-90">"我觉得我做不下去了。不能像这样。"</p>
<span class="text-[10px] text-on-surface-variant absolute -bottom-5 right-1">2分钟前保存草稿</span>
</div>
<!-- Input Bar visual -->
<div class="w-full bg-surface-container rounded-full h-12 border border-outline-variant flex items-center px-4 justify-between">
<span class="font-body-md text-on-surface-variant opacity-50">输入消息...</span>
<span class="material-symbols-outlined text-primary-container opacity-50">send</span>
</div>
</div>
<!-- Frame Footer -->
<div class="px-6 py-4 flex justify-between items-center">
<span class="font-headline-md text-headline-md text-on-surface text-[24px]">未发送文本</span>
<button class="w-10 h-10 rounded-full bg-surface-variant border border-outline-variant flex items-center justify-center hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-on-surface text-[20px]">edit</span>
</button>
</div>
</div>
</div>
<!-- Right Column: Atmosphere & Action (Wait States) -->
<div class="lg:col-span-3 flex flex-col gap-6">
<!-- Atmosphere -->
<div class="glass-panel border border-outline-variant rounded-xl p-6 relative overflow-hidden wait-state-pattern">
<div class="flex items-center justify-between mb-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline text-[20px]">partly_cloudy_day</span>
<span class="font-label-caps text-label-caps text-on-surface-variant tracking-widest">氛围</span>
</div>
<span class="material-symbols-outlined text-primary-container opacity-70 text-[20px]">hourglass_empty</span>
</div>
<div class="grid grid-cols-2 gap-3 mt-6">
<div class="h-[60px] bg-surface-variant rounded-lg opacity-40"></div>
<div class="h-[60px] bg-surface-variant rounded-lg opacity-40"></div>
</div>
<div class="mt-4 h-2 bg-surface-variant rounded-full w-full overflow-hidden">
<div class="w-1/3 h-full bg-primary-container/50"></div>
</div>
</div>
<!-- Action -->
<div class="glass-panel border border-outline-variant rounded-xl p-6 relative overflow-hidden wait-state-pattern opacity-80">
<div class="flex items-center justify-between mb-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-outline text-[20px]">directions_run</span>
<span class="font-label-caps text-label-caps text-on-surface-variant tracking-widest">动作</span>
</div>
<span class="material-symbols-outlined text-primary-container opacity-50 text-[20px]">pending</span>
</div>
<div class="flex items-center justify-center h-[80px]">
<span class="font-body-md text-on-surface-variant text-sm border border-outline-variant/50 px-4 py-2 rounded-full">等待向量...</span>
</div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<div class="fixed bottom-0 w-full z-50 flex justify-center items-center py-6 px-10 bg-black/90 backdrop-blur-2xl docked full-width bottom-0 rounded-t-3xl border-t border-cyan-500/20 shadow-[0_-10px_40px_rgba(0,0,0,0.8)]">
<button class="bg-gradient-to-r from-cyan-500 to-blue-600 text-black rounded-full px-8 py-3 shadow-[0_0_15px_rgba(0,240,255,0.4)] hover:brightness-110 hover:shadow-[0_0_25px_rgba(0,240,255,0.6)] active:scale-98 transition-transform flex items-center gap-3">
<span class="font-manrope font-extrabold tracking-widest text-[14px]">确认并继续</span>
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</div>
</body></html>
